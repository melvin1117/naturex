services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: naturex
      POSTGRES_PASSWORD: naturex
      POSTGRES_DB: naturex
    ports:
      - "5432:5432"
    volumes:
      - naturex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturex -d naturex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  naturex_pgdata:
