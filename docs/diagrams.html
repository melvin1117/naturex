<!doctype html>
<!--
  WildWorth in pictures: the source of the README's banner and diagrams, in the brand (DESIGN.md).
  Open it in a browser to see every board; ?d=<board> shows one board alone, at the size it is
  exported (1600 px wide). Re-export the README images at 2x with Playwright:
    page.goto("file://…/docs/diagrams.html?d=pipeline"); page.locator("#c").screenshot(…)
  Boards: banner → docs/readme/banner.jpg · pipeline → docs/readme/rating-pipeline.jpg ·
  architecture → docs/readme/architecture.jpg · story → docs/readme/story.jpg · look1–3 → docs/readme/look-*.jpg · design → docs/readme/design.jpg · system → docs/readme/design-system.jpg.
  Arrows are drawn from the boxes' positions, so moving a box moves its arrows.
  The planning-era explainer that used to live here is in git history (before PR #260).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WildWorth in pictures</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --lime: oklch(0.86 0.135 126); --lime-ink: oklch(0.42 0.1 135); --clay: oklch(0.66 0.13 48);
    --forest: oklch(0.31 0.062 148); --forest-ink: oklch(0.255 0.045 148); --ground: oklch(0.932 0.012 128);
    --lichen: oklch(0.905 0.018 128); --card: oklch(0.988 0.005 118); --sky: oklch(0.72 0.08 232);
    --machine: oklch(0.215 0.035 158); --raised: oklch(0.26 0.038 156); --line: oklch(0.34 0.04 152);
    --ink: oklch(0.94 0.045 122); --muted: oklch(0.74 0.045 135);
    --g-aaa: oklch(0.43 0.1 152); --g-aa: oklch(0.5 0.115 146); --g-a: oklch(0.54 0.12 138); --g-bbb: oklch(0.66 0.13 120);
    --g-bb: oklch(0.7 0.13 92); --g-b: oklch(0.67 0.13 66); --g-c: oklch(0.56 0.14 46); --g-d: oklch(0.52 0.16 30);
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: oklch(0.17 0.03 158); font: 400 20px/1.4 "Hanken Grotesk", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased }
  body.all { padding: 40px; display: grid; gap: 40px; justify-content: center }
  .board { position: relative; width: 1600px; overflow: hidden; background: radial-gradient(120% 90% at 85% 15%, oklch(0.27 0.045 152) 0%, var(--machine) 60%) }
  h1, h2, h3 { font-family: Gloock, serif; font-weight: 400; letter-spacing: -.02em; line-height: 1.04 }
  .abs { position: absolute }
  .muted { color: var(--muted) }
  .mono { font-family: "Geist Mono", monospace }
  .foot { position: absolute; font: 500 19px/1 "Hanken Grotesk"; color: var(--muted) }
  .foot b { color: var(--lime); font-weight: 500 }
  .lockup { position: absolute; display: inline-flex; align-items: center; gap: .28em; line-height: 1; white-space: nowrap }
  .lockup svg { display: block; width: 1.05em; height: 1.05em }
  .wm .w1 { font-family: Gloock; letter-spacing: -.025em }
  .wm .w2 { margin-left: .02em; font: 300 .9em "Hanken Grotesk"; letter-spacing: -.045em }
  /* Boxes */
  .box { position: absolute; border-radius: 20px; background: var(--raised); box-shadow: 0 0 0 1px oklch(0.86 0.135 126 / .16); padding: 20px 22px }
  .box.code { background: oklch(0.235 0.03 158); box-shadow: 0 0 0 1px oklch(0.94 0.045 122 / .14) }
  .box.key { box-shadow: 0 0 0 2px var(--lime), 0 24px 50px -24px rgba(0, 0, 0, .6) }
  .pipeline .box h4 { font-size: 20px; letter-spacing: -.01em }
  .box h4 { display: flex; align-items: center; gap: 12px; font: 600 22px/1.2 "Hanken Grotesk"; color: var(--ink); margin-bottom: 8px }
  .box p { font-size: 18px; line-height: 1.4; color: var(--muted) }
  .box p b { color: var(--ink); font-weight: 400 }
  .icon { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 12px; background: oklch(0.94 0.045 122 / .08); color: var(--ink) }
  .icon.m { background: var(--lime); color: var(--machine) }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .chip { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 8px; font: 600 14px/1 "Geist Mono"; background: oklch(0.94 0.045 122 / .12); color: var(--ink) }
  .chip.m { background: var(--lime); color: var(--machine) }
  .group { position: absolute; border-radius: 28px; border: 1.5px dashed oklch(0.86 0.135 126 / .38) }
  .group > .label { position: absolute; left: 24px; top: -13px; padding: 0 10px; background: var(--machine); font: 500 17px/1.4 "Hanken Grotesk"; color: var(--lime) }
  .lane { position: absolute; border-radius: 28px; background: oklch(0.86 0.135 126 / .05); box-shadow: inset 0 0 0 1px oklch(0.86 0.135 126 / .14) }
  .lane.code { background: oklch(0.94 0.045 122 / .03); box-shadow: inset 0 0 0 1px oklch(0.94 0.045 122 / .1) }
  .lanelabel { position: absolute; font: 600 19px/1.3 "Hanken Grotesk"; color: var(--lime) }
  .lanelabel span { display: block; margin-top: 4px; font-weight: 400; font-size: 16px; color: var(--muted) }
  .lanelabel.code { color: var(--ink) }
  .models { display: grid; grid-template-columns: auto; gap: 9px; margin-top: 6px; font-size: 18px; color: var(--ink) }
  .models span { color: var(--muted) }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
  svg.wires path { fill: none; stroke: var(--lime); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round }
  svg.wires text { font: 500 16px "Geist Mono"; fill: var(--muted) }
  svg.wires rect.tag { fill: var(--machine) }
  /* Banner */
  .banner { background: var(--machine) }
  .banner .ground { position: absolute; inset: 0; background: url(readme/banner-aerial.jpg) center / cover no-repeat }
  .banner .fade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--machine) 0%, oklch(0.215 0.035 158 / .94) 34%, oklch(0.215 0.035 158 / .45) 58%, oklch(0.215 0.035 158 / .05) 82%) }
  .glass { position: absolute; border-radius: 20px; padding: 18px 22px; background: oklch(0.215 0.035 158 / .55); backdrop-filter: blur(14px); box-shadow: 0 0 0 1px oklch(0.94 0.045 122 / .18), 0 20px 50px -20px rgba(0, 0, 0, .6) }
  .grade { display: inline-grid; place-items: center; height: 34px; padding: 0 12px; border-radius: 999px; font: 600 17px/1 "Hanken Grotesk"; color: var(--card) }
  /* Design board */
  .panel { position: absolute; border-radius: 24px; background: var(--raised); box-shadow: 0 0 0 1px oklch(0.86 0.135 126 / .14); padding: 30px 32px }
  .panel h3 { font-size: 34px; margin-bottom: 8px }
  .panel .lede { font-size: 18px; color: var(--muted); line-height: 1.45 }
  .tile { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; width: 130px; padding: 16px 0 14px; border-radius: 16px; background: var(--card); color: var(--forest-ink) }
  .tile svg { width: 64px; height: 64px }
  .tile .s { font: 300 22px/1 "Hanken Grotesk"; letter-spacing: -.02em; font-variant-numeric: tabular-nums }
  .tile .g { font: 600 13px/1 "Hanken Grotesk"; padding: 4px 8px; border-radius: 999px; color: var(--card) }
  .spec { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 16px; padding: 14px 0; border-top: 1px solid var(--line) }
  .spec .k { font: 500 15px/1 "Geist Mono"; color: var(--muted) }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 18px }
  .sw { border-radius: 14px; height: 74px; position: relative; box-shadow: inset 0 0 0 1px oklch(1 0 0 / .08) }
  .sw span { position: absolute; left: 10px; bottom: 8px; font: 500 13px/1.2 "Hanken Grotesk" }
  .ramp { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 14px }
  .ramp div { height: 40px; border-radius: 8px; display: grid; place-items: center; font: 600 14px/1 "Hanken Grotesk"; color: var(--card) }
  .ramp div.dark { color: var(--forest-ink) }
  .beas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 8px; margin: 34px 0 6px; color: var(--ink) }
  .beas svg { color: var(--ink) }
  .beas figure { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 500 14px/1 "Geist Mono"; color: var(--muted) }
  .beas svg { width: 104px; height: 108px; overflow: visible }
  .bea-ground { fill: var(--raised) }

  /* Design boards */
  .dpanel { position: absolute; border-radius: 24px; background: var(--raised); box-shadow: 0 0 0 1px oklch(0.86 0.135 126 / .14); padding: 28px 30px }
  .dpanel.paper { background: var(--card); color: var(--forest-ink); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .6) }
  .dpanel h3 { font-size: 32px; margin-bottom: 8px }
  .dpanel .lede { font-size: 17px; color: var(--muted); line-height: 1.45 }
  .dpanel.paper .lede { color: oklch(0.47 0.035 145) }
  .kicker { font: 500 14px/1 "Geist Mono"; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); margin-bottom: 12px }
  .dpanel.paper .kicker { color: var(--lime-ink) }
  .name-big { font-size: 64px; line-height: 1; margin: 18px 0 14px }
  .name-big .w1 { font-family: Gloock; letter-spacing: -.025em }
  .name-big .w2 { font: 300 .9em "Hanken Grotesk"; letter-spacing: -.045em }
  .etym { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin-top: 18px; font-size: 17px; align-items: baseline }
  .etym b { font: 500 15px "Geist Mono"; color: var(--lime); font-weight: 500 }
  .dial { position: relative; display: grid; place-items: center }
  .dial .num { position: absolute; text-align: center }
  .dial .num b { display: block; font: 300 54px/1 "Hanken Grotesk"; letter-spacing: -.03em; font-weight: 300 }
  .dial .num span { font: 500 14px/1 "Hanken Grotesk"; color: var(--muted) }
  .gl { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round }
  .gl .as { stroke: var(--lime-ink) } .gl .af { fill: var(--lime); stroke: currentColor; stroke-width: 1.4 } .gl .f { fill: currentColor; stroke: none }
  .icongrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px 8px; margin-top: 20px }
  .icongrid figure { display: flex; flex-direction: column; align-items: center; gap: 9px; font: 500 13px/1.2 "Hanken Grotesk"; text-align: center; color: oklch(0.47 0.035 145) }
  .icongrid svg { width: 34px; height: 34px }
  .motion { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: 14px }
  .motion div { display: grid; grid-template-columns: 90px 1fr auto; gap: 14px; align-items: baseline; padding: 13px 0; border-top: 1px solid var(--line); font-size: 17px }
  .motion b { font: 600 18px "Hanken Grotesk"; color: var(--ink) }
  .motion span { color: var(--muted) }
  .motion i { font: 500 14px "Geist Mono"; font-style: normal; color: var(--lime) }

  /* A look inside */
  .shot { position: absolute; overflow: hidden; border-radius: 18px; background: var(--card); box-shadow: 0 0 0 1px oklch(1 0 0 / .08), 0 36px 70px -30px rgba(0, 0, 0, .75) }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left }
  .cap { position: absolute; font: 500 26px/1.2 "Hanken Grotesk"; color: var(--ink) }
  .cap b { display: block; font: 600 21px/1.25 "Hanken Grotesk"; color: var(--ink); margin-bottom: 4px }
  .lookhead { position: absolute; left: 70px; top: 52px }
  .lookhead h2 { font-size: 56px }
  .lookhead p { color: var(--muted); font-size: 19px; margin-top: 8px; width: 900px }
</style>
</head>

  const cx = size / 2, outer = size / 2 - 4, inner = outer * 0.72, n = Math.round(score);
  let out = "";
  for (let c = 0; c < 100; c++) {
    const a = (c / 100) * Math.PI * 2 - Math.PI / 2;
    for (let r = 0; r < 5; r++) {
      if ((c * 7 + r * 13) % 11 === 0 && r > 2) continue;
      const rad = inner + ((outer - inner) * r) / 4;
      out += `<circle cx="${(cx + Math.cos(a) * rad).toFixed(2)}" cy="${(cx + Math.sin(a) * rad).toFixed(2)}" r="${(size / 210 + (r === 2 ? 0.25 : 0)).toFixed(2)}" fill="${c < n ? lit : unlit}"/>`;

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${out}</svg>`;
};

function render(name, host) {
  const d = BOARDS[name];
  const c = document.createElement("div");
  c.className = `board ${name}`;
  c.id = host ? "c" : `b-${name}`;
  c.style.height = d.h + "px";
  c.innerHTML = d.html;
  document.body.appendChild(c);
  return { c, d };
}

function wire({ c, d }) {
  const svg = c.querySelector("svg.wires");
  if (!svg) return;
  const base = c.getBoundingClientRect();
  const r = (id) => { const b = c.querySelector("#" + id).getBoundingClientRect(); return { l: b.left - base.left, t: b.top - base.top, r: b.right - base.left, b: b.bottom - base.top }; };
  let out = `<defs><marker id="a-${c.id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="oklch(0.86 0.135 126)" stroke="none"/></marker></defs>`;
  const arrow = (p) => (out += `<path d="${p}" marker-end="url(#a-${c.id})"/>`);
  const tag = (x, y, text, anchor = "start") => {
    const w = text.length * 9.8 + 14, x0 = anchor === "middle" ? x - w / 2 : x - 7;
    out += `<rect class="tag" x="${x0}" y="${y - 16}" width="${w}" height="23" rx="5"/><text x="${anchor === "middle" ? x : x}" y="${y}" text-anchor="${anchor}">${text}</text>`;
  };
  for (const [kind, from, to, label, f] of d.wires) {
    if (kind[0] === "v") {
      const A = r(from), B = r(to), lo = Math.max(A.l, B.l), hi = Math.min(A.r, B.r);
      const x = kind === "v" ? (lo + hi) / 2 : lo + (hi - lo) * (kind === "v1" ? 0.3 : 0.7);
      const down = B.t > A.b, y1 = down ? A.b + 5 : A.t - 5, y2 = down ? B.t - 7 : B.b + 7;
      arrow(`M${x} ${y1} L${x} ${y2}`);
      if (label) tag(x + 18, (y1 + y2) / 2 + 6, label);
    } else if (kind === "h") {
      const A = r(from), B = r(to), y = (Math.max(A.t, B.t) + Math.min(A.b, B.b)) / 2;
      arrow(`M${A.r + 5} ${y} L${B.l - 7} ${y}`);
      if (label) tag((A.r + B.l) / 2, y - 12, label, "middle");
    } else if (kind === "d") {
      const A = r(from), B = r(to), lo = Math.max(A.l, B.l), hi = Math.min(A.r, B.r), x = lo + (hi - lo) * (f ?? 0.5);
      arrow(`M${x} ${A.b + 5} L${x} ${B.t - 7}`);
      if (label) tag(x + 16, (A.b + B.t) / 2 + 6, label);
    } else if (kind === "hg") {
      const A = r(from), y = (A.t + A.b) / 2;
      arrow(`M${A.r + 5} ${y} L${to - 7} ${y}`);
    }
  }
  svg.innerHTML = out;
}
