# Backend quality gate: lint, type-check, unit/integration tests, package build.
name: backend

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always runs so the workflow is not empty when the app is not scaffolded yet.
  detect:
    name: backend / detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: Detect backend package
        run: |
          if [ -f backend/pyproject.toml ] && [ -f backend/uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Backend package found."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ not scaffolded in this commit — lint/test/build skipped."
          fi

  lint:
    name: backend / lint
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app tests migrations

      - name: Ruff format
        run: uv run ruff format --check app tests migrations

      - name: Mypy
        run: uv run mypy app

  test:
    name: backend / test
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: naturex
          POSTGRES_PASSWORD: naturex
          POSTGRES_DB: naturex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naturex -d naturex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      REQUIRE_DB: "true"
      DATABASE_URL: postgresql+psycopg://naturex:naturex@localhost:5432/naturex
      USE_MOCKS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest -q --junitxml=pytest-report.xml

      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  build:
    name: backend / build
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build wheel
        run: uv build

  api-client:
    name: backend / api-client drift
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hashFiles() isn't allowed in a job-level `if:`, so detect the frontend in a step.
      - id: frontend
        name: Detect frontend client
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/pnpm-lock.yaml ] && [ -f scripts/generate-client.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend client not scaffolded yet — drift check skipped."
          fi

      - name: Install uv
        if: steps.frontend.outputs.present == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Node.js
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Sync backend dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Regenerate client and fail on drift
        if: steps.frontend.outputs.present == 'true'
        run: |
          ./scripts/generate-client.sh
          git diff --exit-code -- frontend/src/lib/api/openapi.json frontend/src/lib/api/schema.d.ts
