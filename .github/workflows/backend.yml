name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "Makefile"
      - "compose.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "Makefile"
      - "compose.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: naturex
          POSTGRES_PASSWORD: naturex
          POSTGRES_DB: naturex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naturex -d naturex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://naturex:naturex@localhost:5432/naturex

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app tests

      - name: Ruff format
        run: uv run ruff format --check app tests

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest -q
