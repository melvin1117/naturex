# The eval harness (T47, evals/README.md) on demand: every eval against a fresh, seeded database
# with the live models, then evals/results.md and the JSON summaries as an artifact. Manual only,
# not nightly: an uncached run costs about $0.40 of the shared $25 Token Factory credit. Needs the
# NEBIUS_API_KEY repository secret; without it the job says so and stops.
name: eval

on:
  workflow_dispatch:
    inputs:
      evals:
        description: "Evals to run (news auditor copilot schema); the cheap pair by default"
        required: false
        default: "copilot schema"

concurrency:
  group: eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: eval / run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wildworth
          POSTGRES_PASSWORD: wildworth
          POSTGRES_DB: wildworth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildworth -d wildworth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://wildworth:wildworth@localhost:5432/wildworth
      ENVIRONMENT: test
      USE_MOCKS: "false"
      LLM_BUDGET_USD: "1"
      EVAL_BUDGET_USD: "0.60"
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      EVALS: ${{ inputs.evals }}
    steps:
      - name: Check for the Token Factory key
        id: key
        run: |
          if [ -z "$NEBIUS_API_KEY" ]; then
            echo "::notice::Add the NEBIUS_API_KEY repository secret to run the evals."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the eval list
        if: steps.key.outputs.present == 'true'
        run: |
          for e in $EVALS; do
            case "$e" in news|auditor|copilot|schema) ;; *) echo "::error::unknown eval: $e"; exit 1;; esac
          done

      - name: Check out repository
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        if: steps.key.outputs.present == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Node (promptfoo)
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Database and model settings
        if: steps.key.outputs.present == 'true'
        run: |
          grep -E '^(TOKEN_FACTORY_BASE_URL|MODEL_[A-Z_]+)=' .env.example >> "$GITHUB_ENV"
          cd backend && uv sync --frozen && uv run alembic upgrade head && uv run python -m app.seed

      - name: Run the evals
        if: steps.key.outputs.present == 'true'
        run: make eval EVALS="$EVALS"

      - name: Upload the results
        if: steps.key.outputs.present == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: |
            evals/results.md
            evals/results/
          if-no-files-found: ignore
