# T38: the quarterly re-rate (dev-spec §9). Runs `python -m app.jobs.rerate_all` against the
# deployed database: every listed live asset is re-rated through the rating service (alerts on
# health Δ ≥ 5 or a grade change, price re-anchored to the new fair value), then the quarter's
# revenue is paid once per asset (T41). The job is idempotent (one claim per asset and quarter;
# payouts unique per quarter) and budget-capped (MONITOR_JOB_BUDGET_USD per run, LLM_BUDGET_USD
# overall), so a manual re-run or a retry never re-rates, alerts or pays twice.
#
# Scheduled near the end of each quarter, on the 28th and again on the 30th of March, June,
# September and December, so the default period is the quarter being closed. The second run is a
# retry in the same window: the claims make it finish only what the first one didn't (a missed
# schedule, a failure or a budget stop) and never re-rate, alert or pay twice. A manual run may name another `period`
# (`YYYYQn`, never in the future) and a lower `max_usd`; both are validated by the job (exit 2).
# The demo's Time Machine doesn't use this: it runs in-process (`POST /admin/simulate/quarter`).
#
# Fail safe: without its configuration (forks, or before T20 deploys a database) it only logs a
# notice and succeeds. Secrets: RERATE_ALL_DATABASE_URL, NEBIUS_API_KEY, TAVILY_API_KEY.
# Variables: MODEL_ORCHESTRATOR, MODEL_AUDITOR, MODEL_FAST and LLM_BUDGET_USD (the global cap,
# required so the job never assumes one); optional MONITOR_JOB_BUDGET_USD (default 2).
#
# RERATE_ALL_DATABASE_URL must be a role used only by this job, never the owner or a superuser:
# CONNECT, SELECT on what a rating and a payout read, INSERT on monitor_runs, metrics, reports,
# ledger_entries, prices, events, alerts, alert_recipients, payout_lines, world_events and
# llm_calls (plus USAGE on their sequences), and UPDATE on monitor_runs, assets (community wallet,
# listing status), users (cash balances), alert_recipients and llm_calls, plus on worlds and
# holdings, whose rows the rating and the payout lock (`SELECT … FOR UPDATE / KEY SHARE`).
name: rerate-all

on:
  schedule:
    - cron: "41 6 28 3,6,9,12 *"
    - cron: "41 6 30 3,6,9,12 *"
  workflow_dispatch:
    inputs:
      period:
        description: "Quarter to re-rate and pay (YYYYQn, default: the current one)"
        required: false
        default: ""
      max_usd:
        description: "This run's LLM cap in USD (default: MONITOR_JOB_BUDGET_USD)"
        required: false
        default: ""

concurrency:
  group: rerate-all
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rerate:
    name: rerate-all / run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - id: secrets
        name: Check configuration
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.RERATE_ALL_DATABASE_URL }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MODEL_ORCHESTRATOR: ${{ vars.MODEL_ORCHESTRATOR }}
          MODEL_AUDITOR: ${{ vars.MODEL_AUDITOR }}
          MODEL_FAST: ${{ vars.MODEL_FAST }}
          LLM_BUDGET_USD: ${{ vars.LLM_BUDGET_USD }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$NEBIUS_API_KEY" ] && [ -n "$TAVILY_API_KEY" ] && [ -n "$MODEL_ORCHESTRATOR" ] && [ -n "$MODEL_AUDITOR" ] && [ -n "$MODEL_FAST" ] && [ -n "$LLM_BUDGET_USD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::quarterly re-rate skipped: RERATE_ALL_DATABASE_URL, NEBIUS_API_KEY, TAVILY_API_KEY, MODEL_ORCHESTRATOR, MODEL_AUDITOR, MODEL_FAST or LLM_BUDGET_USD is not set."
          fi

      - name: Check out repository
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: steps.secrets.outputs.configured == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: uv sync --frozen --no-dev

      - name: Run the quarterly re-rate
        if: steps.secrets.outputs.configured == 'true'
        env:
          ENVIRONMENT: production
          USE_MOCKS: "false"
          DATABASE_URL: ${{ secrets.RERATE_ALL_DATABASE_URL }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MODEL_ORCHESTRATOR: ${{ vars.MODEL_ORCHESTRATOR }}
          MODEL_AUDITOR: ${{ vars.MODEL_AUDITOR }}
          MODEL_FAST: ${{ vars.MODEL_FAST }}
          LLM_BUDGET_USD: ${{ vars.LLM_BUDGET_USD }}
          MONITOR_JOB_BUDGET_USD: ${{ vars.MONITOR_JOB_BUDGET_USD || '2' }}
          # Inputs reach the shell only as environment values, never as script text.
          PERIOD: ${{ inputs.period }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          args=()
          if [ -n "$PERIOD" ]; then args+=(--period "$PERIOD"); fi
          if [ -n "$MAX_USD" ]; then args+=(--max-usd "$MAX_USD"); fi
          uv run python -m app.jobs.rerate_all "${args[@]}"
