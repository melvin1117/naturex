# Real-account E2E (T74): Playwright drives both apps on the real stack (Postgres + pgvector,
# FastAPI, a production Next.js build) with USE_MOCKS=true, so it needs no secrets. Only PRs
# (ready for review, not drafts) and pushes to main that touch the apps (or this harness) run
# it, and a newer push cancels the older run, to save Actions minutes. The push to main catches
# a break that two separately green PRs make together. Path-filtered, so don't make it a
# required check (docs/ci.md).
name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/e2e-backend.sh"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/e2e-backend.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-accounts:
    name: e2e / real accounts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wildworth
          POSTGRES_PASSWORD: wildworth
          POSTGRES_DB: wildworth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildworth -d wildworth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      E2E_DATABASE_URL: postgresql+psycopg://wildworth:wildworth@localhost:5432/wildworth_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Enable pnpm (Corepack)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Headless shell only (the suite never runs headed); --with-deps installs the system
      # libraries every run, since the cache holds only the browser.
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run the real-account E2E
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Upload the Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
