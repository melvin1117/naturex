# Real-account E2E (T74): Playwright drives both apps on the real stack (Postgres + pgvector,
# FastAPI, a production Next.js build) with USE_MOCKS=true, so it needs no secrets. Only PRs that
# touch the apps (or this harness) run it, and a newer push cancels the older run, to save
# Actions minutes. Path-filtered, so don't make it a required check (docs/ci.md).
name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/e2e-backend.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-accounts:
    name: e2e / real accounts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: naturex
          POSTGRES_PASSWORD: naturex
          POSTGRES_DB: naturex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naturex -d naturex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      E2E_DATABASE_URL: postgresql+psycopg://naturex:naturex@localhost:5432/naturex_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Enable pnpm (Corepack)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the real-account E2E
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Upload the Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
