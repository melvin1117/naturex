# The deployed stack on one VM (docs/deploy.md): Postgres with pgvector, the API, the web app and
# Caddy, which serves HTTPS and routes /api straight to the API. Only Caddy publishes ports; the
# database never leaves the internal network.
#
#   docker compose -f deploy/compose.yml up -d --build      (deploy/update.sh does this)
#
# Settings and secrets come from deploy/.env (from deploy/.env.example; never committed) and the
# Earth Engine key from deploy/secrets/ee-service-account.json.
name: wildworth-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wildworth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: wildworth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildworth -d wildworth"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wildworth:${POSTGRES_PASSWORD}@db:5432/wildworth
      EE_SERVICE_ACCOUNT_JSON: /run/secrets/ee-service-account.json
    volumes:
      - ./secrets/ee-service-account.json:/run/secrets/ee-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://backend:8000
        SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      SITE_URL: ${SITE_URL:-}
    depends_on:
      - backend
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Same port outside and in: a local try serves http://localhost:8088 on 8088.
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
